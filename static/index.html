<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalshi MM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --page: #06090e;
  --surface: #0f141c;
  --surface-2: #141b25;
  --surface-3: #1a2330;
  --line: rgba(140, 200, 255, 0.09);
  --line-strong: rgba(140, 200, 255, 0.18);
  --ink: #eef3f8;
  --ink-2: #b4c0cd;
  --ink-3: #7d8a99;
  --accent: #5ce1ff;          /* chrome only: buttons, focus, brand */
  --accent-2: #9085e9;
  --accent-glow: rgba(92, 225, 255, 0.35);
  --grid: #1d2632;
  --axis: #2c3846;
  /* data roles (validated on --surface: bid/ask pair passes all checks) */
  --bid: #3987e5;
  --ask: #e66767;
  --fv: #199e70;              /* model fair value — always dashed + labelled (CVD warn band vs ask) */
  --equity: #3987e5;
  /* status — always paired with icon + label */
  --good: #0ca30c;
  --warn: #fab219;
  --crit: #d03b3b;
  --good-ink: #3ddc6a;
  --crit-ink: #ff7a7a;
  --radius: 14px;
  --sans: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background:
    radial-gradient(1200px 600px at 85% -10%, rgba(144,133,233,0.10), transparent 60%),
    radial-gradient(900px 500px at -10% 10%, rgba(92,225,255,0.07), transparent 60%),
    var(--page);
  color: var(--ink);
  font: 14px/1.45 var(--sans);
  min-height: 100vh;
  overflow-x: hidden;
}
body::before { /* faint blueprint grid */
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    linear-gradient(rgba(140,200,255,0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(140,200,255,0.035) 1px, transparent 1px);
  background-size: 48px 48px;
  mask-image: linear-gradient(to bottom, black, transparent 85%);
}
.wrap { position: relative; z-index: 1; max-width: 1600px; margin: 0 auto; padding: 20px 24px 48px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; cursor: pointer; }

/* ---- header ---- */
header {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 14px 18px; margin-bottom: 18px;
  background: linear-gradient(180deg, rgba(20,27,37,0.85), rgba(15,20,28,0.85));
  border: 1px solid var(--line); border-radius: var(--radius);
  backdrop-filter: blur(10px);
  box-shadow: 0 0 0 1px rgba(92,225,255,0.03), 0 20px 50px -30px rgba(92,225,255,0.25);
}
.brand { display: flex; align-items: center; gap: 12px; margin-right: auto; }
.logo {
  width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
  background: conic-gradient(from 210deg, var(--accent), var(--accent-2), var(--accent));
  box-shadow: 0 0 24px var(--accent-glow);
}
.logo svg { width: 18px; height: 18px; }
.brand h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; }
.brand h1 span { color: var(--accent); }
.brand small { display: block; color: var(--ink-3); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 11px;
  border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface-2);
  font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2);
  white-space: nowrap;
}
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
.chip.good { color: var(--good-ink); border-color: rgba(12,163,12,0.45); }
.chip.good .dot { background: var(--good); box-shadow: 0 0 10px var(--good); animation: pulse 1.6s infinite; }
.chip.crit { color: var(--crit-ink); border-color: rgba(208,59,59,0.55); background: rgba(208,59,59,0.12); }
.chip.crit .dot { background: var(--crit); box-shadow: 0 0 10px var(--crit); }
.chip.warn { color: var(--warn); border-color: rgba(250,178,25,0.45); }
.chip.warn .dot { background: var(--warn); }
.chip.accent { color: var(--accent); border-color: rgba(92,225,255,0.4); }
.chip.accent .dot { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
@keyframes pulse { 50% { opacity: 0.35; } }
.meta { color: var(--ink-3); font-size: 12px; display: flex; gap: 14px; }
.meta b { color: var(--ink-2); font-weight: 500; }
.controls { display: flex; gap: 8px; }
.btn {
  height: 36px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line-strong);
  background: var(--surface-3); font-weight: 600; letter-spacing: 0.04em; font-size: 13px;
  display: inline-flex; align-items: center; gap: 8px; transition: all .15s;
}
.btn:hover { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(92,225,255,0.12); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
.btn.primary { background: linear-gradient(135deg, rgba(92,225,255,0.22), rgba(144,133,233,0.22)); border-color: rgba(92,225,255,0.5); color: #fff; }
.btn.danger { background: rgba(208,59,59,0.14); border-color: rgba(208,59,59,0.55); color: var(--crit-ink); }
.btn.danger:hover { border-color: var(--crit); box-shadow: 0 0 0 3px rgba(208,59,59,0.2); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12px; border-radius: 8px; }
.btn svg { width: 14px; height: 14px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---- panels ---- */
.panel {
  background: linear-gradient(180deg, rgba(20,27,37,0.9), rgba(15,20,28,0.9));
  border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px;
  position: relative; min-width: 0;
}
.panel h2 {
  margin: 0 0 12px; font-size: 11px; font-weight: 600; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--ink-3); display: flex; align-items: center; gap: 10px;
}
.panel h2 .grow { flex: 1; }
.grid { display: grid; gap: 16px; }
.kpis { grid-template-columns: 1.3fr repeat(4, 1fr); margin-bottom: 16px; }
.row2 { grid-template-columns: 2fr 1fr; margin-bottom: 16px; }
.row4 { grid-template-columns: 1.4fr 1fr; margin-top: 16px; }

.kpi .label { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }
.kpi .value { font-family: var(--mono); font-size: 26px; font-weight: 500; margin-top: 6px; letter-spacing: -0.01em; }
.kpi.hero .value { font-size: 34px; background: linear-gradient(90deg, #fff, var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.kpi .sub { font-size: 12px; color: var(--ink-3); margin-top: 4px; }
.up { color: var(--good-ink); } .down { color: var(--crit-ink); }
.meter { height: 6px; border-radius: 99px; background: var(--surface-3); margin-top: 12px; overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .4s; }
.meter.hot i { background: linear-gradient(90deg, var(--warn), var(--crit)); }

/* ---- charts ---- */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart .tick { fill: var(--ink-3); font: 10.5px var(--mono); }
.chart .gridline { stroke: var(--grid); stroke-width: 1; }
.chart .baseline { stroke: var(--axis); stroke-width: 1; }
.chart .xhair { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 3 3; }
.tip {
  position: absolute; pointer-events: none; z-index: 5; min-width: 120px;
  background: rgba(10,14,20,0.96); border: 1px solid var(--line-strong); border-radius: 10px;
  padding: 8px 10px; font-size: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  opacity: 0; transition: opacity .1s;
}
.tip .t { color: var(--ink-3); font: 11px var(--mono); margin-bottom: 4px; }
.tip .r { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.tip .k { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
.tip .sw { width: 10px; height: 3px; border-radius: 2px; }
.tip .v { font-family: var(--mono); color: var(--ink); }
.legend { display: flex; gap: 14px; font-size: 11px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 3px; border-radius: 2px; display: inline-block; }
.legend i.dash { background: repeating-linear-gradient(90deg, var(--fv) 0 4px, transparent 4px 7px) !important; }
.mode { font: 600 10px var(--sans); letter-spacing: .12em; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--line-strong); color: var(--ink-2); white-space: nowrap; }
.mode.fair-value { color: var(--accent); border-color: rgba(92,225,255,.45); }
.mode.exit, .mode.ro { color: var(--warn); border-color: rgba(250,178,25,.45); }
.fvline { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--ink-3); margin: -2px 0 10px; }
.fvline b { font: 500 13px var(--mono); color: var(--ink); }
.arb { display: grid; gap: 10px; }
.arbcard { border: 1px solid rgba(12,163,12,.45); background: rgba(12,163,12,.06); border-radius: 10px; padding: 10px 12px; font-size: 12.5px; }
.arbcard .legs { font: 12px var(--mono); color: var(--ink-2); margin-top: 6px; display: grid; gap: 2px; }
.empty { color: var(--ink-3); text-align: center; padding: 34px 10px; font-size: 13px; }
.empty b { color: var(--ink-2); font-weight: 500; }

/* ---- risk panel ---- */
.kv { display: grid; grid-template-columns: 1fr auto; gap: 9px 12px; font-size: 13px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; font-family: var(--mono); color: var(--ink); text-align: right; }
.sep { height: 1px; background: var(--line); margin: 14px 0; }
.halt-box {
  display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px;
  background: rgba(208,59,59,0.12); border: 1px solid rgba(208,59,59,0.5); color: var(--crit-ink);
  margin-bottom: 14px; font-size: 13px;
}
.ok-box { background: rgba(12,163,12,0.08); border-color: rgba(12,163,12,0.4); color: var(--good-ink); }
.halt-box svg { flex: none; width: 16px; height: 16px; margin-top: 2px; }

/* ---- markets ---- */
.section-head { display: flex; align-items: center; gap: 12px; margin: 22px 0 12px; flex-wrap: wrap; }
.section-head h3 { margin: 0; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
.section-head .grow { flex: 1; }
.add { display: flex; gap: 8px; }
.input {
  height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line-strong);
  background: var(--surface); color: var(--ink); font: 13px var(--mono); width: 280px; max-width: 100%;
}
.input::placeholder { color: var(--ink-3); }
.markets { grid-template-columns: repeat(auto-fill, minmax(min(100%, 460px), 1fr)); }
.mcard { padding: 16px 18px 14px; }
.mcard::before {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 2px; border-radius: var(--radius) var(--radius) 0 0;
  background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: 0.5;
}
.mhead { display: flex; gap: 10px; align-items: flex-start; }
.mhead .tk { font: 600 13px var(--mono); color: var(--accent); letter-spacing: 0.02em; word-break: break-all; }
.mhead .tt { color: var(--ink-2); font-size: 12.5px; margin-top: 2px; }
.mhead .grow { flex: 1; min-width: 0; }
.x { border: 0; background: transparent; color: var(--ink-3); width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; }
.x:hover { background: var(--surface-3); color: var(--ink); }
.quote3 { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; margin: 14px 0 10px; align-items: end; }
.quote3 .lab { font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); display: flex; align-items: center; gap: 6px; }
.quote3 .big { font: 500 28px var(--mono); }
.quote3 .r { text-align: right; } .quote3 .r .lab { justify-content: flex-end; }
.spread { text-align: center; padding: 6px 12px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface-2); }
.spread .big { font-size: 18px; }
.spread.ok { border-color: rgba(92,225,255,0.45); box-shadow: 0 0 18px -6px var(--accent-glow); }
.sq { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.mbody { display: grid; grid-template-columns: 1fr 150px; gap: 14px; align-items: start; }
.ladder { font: 11px var(--mono); }
.ladder .lrow { display: grid; grid-template-columns: 30px 1fr 44px; gap: 6px; align-items: center; height: 15px; margin-bottom: 2px; }
.ladder .bar { height: 11px; border-radius: 0 4px 4px 0; min-width: 2px; }
.ladder .px { color: var(--ink-2); text-align: right; }
.ladder .sz { color: var(--ink-3); text-align: right; }
.ladder .mid { border-top: 1px dashed var(--axis); margin: 5px 0; }
.ladder .cap { font: 10px var(--sans); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
.mfoot { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-3); }
.qchip { font: 11.5px var(--mono); padding: 3px 8px; border-radius: 6px; border: 1px solid var(--line-strong); color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; }
.mfoot .grow { flex: 1; }

/* ---- tables ---- */
.tabs { display: flex; gap: 4px; }
.tab { border: 1px solid transparent; background: transparent; color: var(--ink-3); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; padding: 5px 10px; border-radius: 8px; }
.tab.on { color: var(--ink); background: var(--surface-3); border-color: var(--line-strong); }
.tablewrap { overflow: auto; max-height: 360px; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th { text-align: left; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; padding: 8px 10px; position: sticky; top: 0; background: var(--surface); border-bottom: 1px solid var(--line-strong); }
td { padding: 8px 10px; border-bottom: 1px solid var(--line); color: var(--ink-2); vertical-align: middle; }
td.n, th.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
tr:hover td { background: rgba(92,225,255,0.03); }
td .tkc { font-family: var(--mono); color: var(--ink); }
td .sub { color: var(--ink-3); font-size: 11.5px; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line-strong); white-space: nowrap; }
.pill.good { color: var(--good-ink); border-color: rgba(12,163,12,0.45); }
.pill svg { width: 11px; height: 11px; }

/* ---- console ---- */
.console { font: 11.5px/1.6 var(--mono); max-height: 360px; overflow: auto; background: #070b10; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.console .l { white-space: pre-wrap; word-break: break-word; color: var(--ink-2); }
.console .ts { color: var(--ink-3); margin-right: 8px; }
.console .WARNING { color: var(--warn); }
.console .ERROR, .console .CRITICAL { color: var(--crit-ink); }
.console .fill { color: var(--good-ink); }

.toast { position: fixed; right: 20px; bottom: 20px; z-index: 50; padding: 10px 14px; border-radius: 10px; background: rgba(10,14,20,0.96); border: 1px solid var(--line-strong); font-size: 13px; transform: translateY(20px); opacity: 0; transition: all .2s; max-width: 420px; }
.toast.show { transform: none; opacity: 1; }
.toast.err { border-color: rgba(208,59,59,0.6); color: var(--crit-ink); }
.banner { margin-bottom: 16px; padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(250,178,25,0.4); background: rgba(250,178,25,0.07); color: var(--warn); font-size: 13px; display: flex; gap: 10px; align-items: center; }

@media (max-width: 1200px) {
  .kpis { grid-template-columns: repeat(3, 1fr); }
  .kpi.hero { grid-column: span 3; }
  .row2, .row4 { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .wrap { padding: 12px 16px 40px; }
  .kpis { grid-template-columns: 1fr 1fr; }
  .kpi.hero { grid-column: span 2; }
  .mbody { grid-template-columns: 1fr; }
  .meta { display: none; }
  .input { width: 100%; }
  .add { width: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="brand">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#06090e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 4 8-10"/></svg></div>
    <div><h1>Kalshi <span>//</span> MM</h1><small>Prediction-market maker</small></div>
  </div>
  <div class="chips" id="chips"></div>
  <div class="meta" id="meta"></div>
  <div class="controls">
    <button class="btn primary" id="btnRun"></button>
    <button class="btn danger" id="btnKill" title="Halt the bot and cancel every quote">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v6"/><circle cx="12" cy="16.5" r=".6" fill="currentColor"/></svg>Kill switch
    </button>
  </div>
</header>

<div id="banner"></div>

<section class="grid kpis" id="kpis"></section>

<section class="grid row2">
  <div class="panel">
    <h2>Paper equity <span class="grow"></span><span class="num" id="eqRange" style="letter-spacing:0;text-transform:none"></span></h2>
    <div class="chart" id="equity"></div>
  </div>
  <div class="panel" id="riskPanel"></div>
</section>

<div class="section-head">
  <h3>Live markets</h3><span class="chip" id="mcount"></span>
  <span class="grow"></span>
  <button class="btn primary" id="btnAutopick" title="Pick the best BTC/ETH strikes for the fair-value strategy (keeps markets with open positions)">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>Auto-pick</button>
  <label class="chip" style="cursor:pointer" title="Re-centre on the strikes nearest the money every 15 min (and when a market nears close). Markets rolled off with a position go reduce-only until flat."><input type="checkbox" id="autoRotate" style="accent-color:var(--accent);margin:0"> Auto-rotate</label>
  <form class="add" id="addForm" autocomplete="off">
    <input class="input" id="addInput" placeholder="Add ticker, e.g. KXBTCD-26OCT2017-T…" spellcheck="false">
    <button class="btn" type="submit">Watch</button>
  </form>
</div>
<section class="grid markets" id="markets"></section>

<div class="section-head">
  <h3>Market scanner</h3>
  <span class="chip" id="scanMeta">all of Kalshi</span>
  <span class="grow"></span>
  <span class="tabs" id="scanTabs">
    <button class="tab stab on" data-stab="fair-value">Fair value</button>
    <button class="tab stab" data-stab="book">Spread capture</button>
    <button class="tab stab" data-stab="rejected">Rejected</button>
  </span>
  <button class="btn sm" id="btnScan">Rescan</button>
</div>
<section class="grid row4" style="margin-top:0">
  <div class="panel"><div id="scanNote" class="sub" style="font-size:12px;color:var(--ink-3);margin-bottom:8px"></div><div class="tablewrap" id="scanner" style="max-height:460px"><div class="empty">Sweeping every open market (~15s)…</div></div></div>
  <div class="panel"><h2>Arbitrage <span class="grow"></span><span class="num" id="arbMeta" style="letter-spacing:0;text-transform:none"></span></h2><div class="arb" id="arb"><div class="empty">Waiting for first sweep…</div></div></div>
</section>

<section class="grid row4">
  <div class="panel">
    <h2><span class="tabs"><button class="tab on" data-tab="fills">Fills</button><button class="tab" data-tab="bymkt">P&amp;L by market</button></span><span class="grow"></span></h2>
    <div class="tablewrap" id="ledger"></div>
  </div>
  <div class="panel">
    <h2>Console <span class="grow"></span><span class="num" id="logCount" style="letter-spacing:0"></span></h2>
    <div class="console" id="console"></div>
  </div>
</section>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const usd = (v, sign=false) => (sign && v > 0 ? "+" : v < 0 ? "−" : "") + "$" + Math.abs(v).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
const cents = (v) => v == null ? "—" : `${v}¢`;
const t2 = (ts) => new Date(ts * 1000).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", second: "2-digit"});
const dt = (ts) => new Date(ts * 1000).toLocaleString([], {month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"});
const dur = (s) => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60); return h ? `${h}h ${m}m` : m ? `${m}m ${s%60}s` : `${s}s`; };
const untilClose = (iso) => { if (!iso) return ""; const s = (new Date(iso) - Date.now()) / 1000; return s <= 0 ? "closed" : s > 86400*2 ? `${Math.round(s/86400)}d` : dur(s); };
const ICON = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12l5 5 9-10"/></svg>',
  warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l10 18H2z"/><path d="M12 10v5"/><circle cx="12" cy="18" r=".6" fill="currentColor"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
  x: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  up: "▲", down: "▼",
};

let S = null, tab = "fills", scanData = null;

async function api(method, path, body) {
  const r = await fetch(path, {method, headers: {"Content-Type": "application/json"}, body: body ? JSON.stringify(body) : undefined});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.msg || r.statusText);
  return j;
}
function toast(msg, err=false) {
  const t = $("toast"); t.textContent = msg; t.className = "toast show" + (err ? " err" : "");
  clearTimeout(t._h); t._h = setTimeout(() => t.className = "toast", 3200);
}
async function act(method, path, body, okMsg) {
  try { await api(method, path, body); if (okMsg) toast(okMsg); await poll(); }
  catch (e) { toast(e.message, true); }
}

/* ---------- line chart (SVG, hover crosshair + tooltip) ---------- */
function lineChart(el, {series, height=220, yFmt=(v)=>v, xFmt=t2, area=false, yMin=null, yMax=null, band=null, labels=false}) {
  series = series.filter(s => s.values.some(p => p.y != null));  // e.g. a one-sided book
  const W = Math.max(280, el.clientWidth), H = height, P = {l: 52, r: labels ? 44 : 12, t: 10, b: 24};
  const pts = series.flatMap(s => s.values.filter(p => p.y != null));
  if (pts.length < 2) { el.innerHTML = `<div class="empty" style="height:${H}px;display:grid;place-items:center">Collecting data…</div>`; return; }
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x1 === x0) x1 = x0 + 1;
  let y0 = yMin ?? Math.min(...ys), y1 = yMax ?? Math.max(...ys);
  const pad = Math.max((y1 - y0) * 0.12, 0.5); y0 -= pad; y1 += pad;
  const X = (x) => P.l + (x - x0) / (x1 - x0) * (W - P.l - P.r);
  const Y = (y) => P.t + (1 - (y - y0) / (y1 - y0)) * (H - P.t - P.b);
  const ticks = 4, grid = [];
  for (let i = 0; i <= ticks; i++) {
    const v = y0 + (y1 - y0) * i / ticks, y = Y(v);
    grid.push(`<line class="gridline" x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}"/><text class="tick" x="${P.l-8}" y="${y+3.5}" text-anchor="end">${esc(yFmt(v))}</text>`);
  }
  const xv = W < 520 ? [[x0, "start"], [x1, "end"]] : [[x0, "start"], [(x0+x1)/2, "middle"], [x1, "end"]];
  const xt = xv.map(([v, a]) => `<text class="tick" x="${X(v)}" y="${H-6}" text-anchor="${a}">${esc(xFmt(v))}</text>`).join("");
  const path = (vals) => { let d = "", pen = false; for (const p of vals) { if (p.y == null) { pen = false; continue; } d += (pen ? "L" : "M") + X(p.x).toFixed(1) + " " + Y(p.y).toFixed(1); pen = true; } return d; };
  let defs = "", body = "";
  if (band) {
    const [lo, hi] = band, top = hi.values.filter(p => p.y != null), bot = lo.values.filter(p => p.y != null).slice().reverse();
    if (top.length && bot.length) body += `<path d="${path(top)} ${bot.map(p => "L" + X(p.x).toFixed(1) + " " + Y(p.y).toFixed(1)).join("")} Z" fill="rgba(140,200,255,0.06)"/>`;
  }
  // end-of-line labels: keep at least 12px apart so close prices don't collide
  const labelY = series.map(s => { const v = s.values.filter(p => p.y != null); return Y(v[v.length-1].y); });
  const order = labelY.map((y, i) => i).sort((a, b) => labelY[a] - labelY[b]);
  for (let k = 1; k < order.length; k++) labelY[order[k]] = Math.max(labelY[order[k]], labelY[order[k-1]] + 12);
  series.forEach((s, i) => {
    const v = s.values.filter(p => p.y != null);
    if (area) {
      defs += `<linearGradient id="g${i}${el.id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity=".28"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient>`;
      body += `<path d="${path(v)} L${X(v[v.length-1].x)} ${H-P.b} L${X(v[0].x)} ${H-P.b} Z" fill="url(#g${i}${el.id})"/>`;
    }
    body += `<path d="${path(s.values)}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"${s.dash ? ` stroke-dasharray="${s.dash}"` : ""}/>`;
    const last = v[v.length - 1];
    body += `<circle cx="${X(last.x)}" cy="${Y(last.y)}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
    if (labels) body += `<text class="tick" x="${X(last.x)+8}" y="${labelY[i]+3.5}" style="fill:var(--ink-2)">${esc(s.name)}</text>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img"><defs>${defs}</defs>${grid.join("")}<line class="baseline" x1="${P.l}" x2="${W-P.r}" y1="${H-P.b}" y2="${H-P.b}"/>${xt}${body}<g class="hov"></g></svg><div class="tip"></div>`;
  const svg = el.querySelector("svg"), hov = svg.querySelector(".hov"), tip = el.querySelector(".tip");
  const allX = [...new Set(series.flatMap(s => s.values.map(p => p.x)))].sort((a, b) => a - b);
  svg.addEventListener("mousemove", (e) => {
    const r = svg.getBoundingClientRect(), mx = (e.clientX - r.left) * W / r.width;
    const xv = x0 + (mx - P.l) / (W - P.l - P.r) * (x1 - x0);
    let best = allX[0]; for (const x of allX) if (Math.abs(x - xv) < Math.abs(best - xv)) best = x;
    const rows = series.map(s => ({s, p: s.values.find(p => p.x === best)})).filter(o => o.p && o.p.y != null);
    hov.innerHTML = `<line class="xhair" x1="${X(best)}" x2="${X(best)}" y1="${P.t}" y2="${H-P.b}"/>` + rows.map(o => `<circle cx="${X(best)}" cy="${Y(o.p.y)}" r="5" fill="${o.s.color}" stroke="var(--surface)" stroke-width="2"/>`).join("");
    tip.innerHTML = `<div class="t">${esc(xFmt(best))}</div>` + rows.map(o => `<div class="r"><span class="k"><i class="sw" style="background:${o.s.color}"></i>${esc(o.s.name)}</span><span class="v">${esc(yFmt(o.p.y))}</span></div>`).join("");
    const px = X(best) / W * r.width;
    tip.style.left = Math.min(px + 14, r.width - 150) + "px"; tip.style.top = "8px"; tip.style.opacity = 1;
  });
  svg.addEventListener("mouseleave", () => { hov.innerHTML = ""; tip.style.opacity = 0; });
}

/* ---------- renderers ---------- */
function renderHeader() {
  const r = S.risk;
  const status = r.halted ? `<span class="chip crit"><span class="dot"></span>Halted</span>`
    : S.running ? `<span class="chip good"><span class="dot"></span>Running</span>`
    : `<span class="chip"><span class="dot"></span>Idle</span>`;
  const mode = S.mode === "LIVE" ? `<span class="chip crit"><span class="dot"></span>Live money</span>` : `<span class="chip accent"><span class="dot"></span>Paper</span>`;
  const auth = S.authenticated ? `<span class="chip">${ICON.check.replace('<svg', '<svg width="12" height="12"')} API key</span>` : `<span class="chip" title="Running on public market data only">Public data</span>`;
  $("chips").innerHTML = status + mode + auth;
  const up = S.running && S.started_at ? dur(S.server_time - S.started_at) : "—";
  $("meta").innerHTML = `<span>Uptime <b class="num">${up}</b></span><span>Cycles <b class="num">${S.cycles}</b></span><span>Last <b class="num">${S.last_cycle_at ? t2(S.last_cycle_at) : "—"}</b></span>`;
  const run = $("btnRun");
  if (r.halted) { run.innerHTML = "Reset kill switch"; run.onclick = () => act("POST", "/api/reset", null, "Kill switch reset"); run.disabled = false; }
  else if (S.running) { run.innerHTML = ICON.stop + "Stop"; run.onclick = () => act("POST", "/api/stop", null, "Stopped — quotes cancelled"); run.disabled = false; }
  else { run.innerHTML = ICON.play + "Start"; run.onclick = () => act("POST", "/api/start", null, "Bot started"); run.disabled = !S.markets.length; run.title = S.markets.length ? "" : "Add a market first"; }
  $("btnKill").disabled = r.halted;
  $("banner").innerHTML = S.mode === "LIVE" ? `<div class="banner">${ICON.warn.replace('<svg', '<svg width="16" height="16"')} LIVE mode: real orders, real money. The order endpoint schema is unverified, so test with quote_size = 1.</div>` : "";
}

function renderKpis() {
  const p = S.pnl, r = S.risk;
  // Balance and net P&L include open positions at the current mid, so they
  // move while a position is at risk, not only when a trade closes.
  const net = p.equity_usd - p.starting_balance_usd, cls = net > 0 ? "up" : net < 0 ? "down" : "";
  const arrow = net > 0 ? ICON.up : net < 0 ? ICON.down : "";
  const exPct = Math.min(100, r.exposure_usd / r.max_exposure_usd * 100);
  const lossUsed = Math.max(0, -r.daily_pnl_usd), lossPct = Math.min(100, lossUsed / r.max_daily_loss_usd * 100);
  const open = p.markets.filter(m => m.net !== 0).length;
  const unpriced = p.unmarked.length ? ` · <span class="down" title="${esc(p.unmarked.join(", "))}">${p.unmarked.length} open position${p.unmarked.length === 1 ? "" : "s"} not priced</span>` : "";
  $("kpis").innerHTML = `
    <div class="panel kpi hero"><div class="label">Paper balance</div><div class="value">${usd(p.equity_usd)}</div><div class="sub">from ${usd(p.starting_balance_usd)} start · open positions at mid${unpriced}</div></div>
    <div class="panel kpi"><div class="label">Net P&amp;L</div><div class="value ${cls}">${arrow ? `<span style="font-size:14px">${arrow}</span> ` : ""}${usd(net, true)}</div><div class="sub">${usd(p.realized_usd, true)} realized · ${usd(p.unrealized_usd, true)} open · ${usd(p.fees_usd)} fees</div></div>
    <div class="panel kpi"><div class="label">Fills</div><div class="value">${p.fill_count}</div><div class="sub">${open} open position${open === 1 ? "" : "s"}</div></div>
    <div class="panel kpi"><div class="label">Exposure</div><div class="value">${usd(r.exposure_usd)}</div><div class="meter ${exPct > 80 ? "hot" : ""}"><i style="width:${exPct}%"></i></div><div class="sub">of ${usd(r.max_exposure_usd)} limit</div></div>
    <div class="panel kpi"><div class="label">Daily loss budget</div><div class="value">${usd(r.max_daily_loss_usd - lossUsed)}</div><div class="meter ${lossPct > 60 ? "hot" : ""}"><i style="width:${lossPct}%"></i></div><div class="sub">left of ${usd(r.max_daily_loss_usd)}</div></div>`;
}

function renderEquity(force=false) {
  if (!force && $("equity").matches(":hover")) return;
  const c = S.pnl.equity_curve;
  const vals = c.length ? [{x: c[0].ts - 1, y: S.pnl.starting_balance_usd}, ...c.map(p => ({x: p.ts, y: p.balance}))] : [];
  // Points are closed trades only (no price history for open positions);
  // the last one is now, with open positions at mid.
  $("eqRange").textContent = c.length ? `${dt(c[0].ts)} → ${dt(c[c.length-1].ts)}${S.pnl.unrealized_usd ? " · last point incl. open positions" : ""}` : "";
  if (vals.length < 2) { $("equity").innerHTML = `<div class="empty" style="height:240px;display:grid;place-items:center"><div><b>No fills yet.</b><br>The equity curve starts with the first paper fill.</div></div>`; return; }
  lineChart($("equity"), {series: [{name: "Balance", color: "var(--equity)", values: vals}], height: 240, area: true, yFmt: (v) => "$" + v.toFixed(2), xFmt: dt});
}

    : `<div class="halt-box ok-box">${ICON.check}<div><b>All limits clear</b><br>${S.last_error ? "Last error: " + esc(S.last_error) : "No errors this session"}</div></div>`;

    <dl class="kv">
      <dt>Session P&amp;L (marked to mid)</dt><dd class="${r.session_pnl_usd > 0 ? "up" : r.session_pnl_usd < 0 ? "down" : ""}">${usd(r.session_pnl_usd, true)}</dd>

    <dl class="kv">

      <dt>Inset · quote size</dt><dd>${pr.quote_inset_cents}¢ · ${pr.quote_size}</dd>
      <dt>Inventory skew at limit</dt><dd>${pr.inventory_skew_cents}¢</dd>

function feedsBlock(f) {
  if (!f) return "";
  const idx = Object.entries(f.index || {}).map(([p, v]) => `<dt>${esc(p.split("-")[0])} index (median of exchanges)</dt><dd>${v != null ? "$" + v.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) : "—"}</dd>`).join("");
  const ex = Object.entries(f.exchanges || {}).filter(([n]) => n !== "kalshi").map(([n, s]) => {
    const live = s.connected && s.age != null && s.age < 10;
    return `<span class="chip" title="${s.msgs} messages${s.error ? " · last error: " + esc(s.error) : ""}"><i class="sq" style="background:${live ? "var(--good)" : "var(--crit)"}"></i> ${esc(n)} ${live ? "live" : "down"}</span>`;
  }).join(" ");
  return `<div class="sep"></div><dl class="kv">${idx}
      <dt>Kalshi data</dt><dd>${esc(f.kalshi_mode)}</dd>
      <dt>Tick → requote</dt><dd>${f.reprice_latency_ms != null ? f.reprice_latency_ms + " ms" : "—"}</dd>
    </dl><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">${ex}</div>`;
}

function ladder(book) {
  if (!book || (!book.bids.length && !book.asks.length)) return `<div class="ladder"><div class="cap">Depth</div><div class="empty" style="padding:20px 0">No book</div></div>`;
  const max = Math.max(...book.bids.map(l => l[1]), ...book.asks.map(l => l[1]), 1);
  const row = (l, color) => `<div class="lrow" title="${l[1].toLocaleString()} contracts @ ${l[0]}¢"><span class="px">${l[0]}¢</span><span><i class="bar" style="display:block;width:${Math.max(2, l[1] / max * 100)}%;background:${color}"></i></span><span class="sz">${l[1] >= 1000 ? (l[1]/1000).toFixed(1) + "k" : Math.round(l[1])}</span></div>`;
  return `<div class="ladder"><div class="cap">Depth · contracts</div>${book.asks.slice(0, 5).reverse().map(l => row(l, "var(--ask)")).join("")}<div class="mid"></div>${book.bids.slice(0, 5).map(l => row(l, "var(--bid)")).join("")}</div>`;
}

function renderMarkets() {
  $("mcount").textContent = `${S.markets.length} watched` + (S.last_autopick ? ` · picked ${t2(S.last_autopick.ts)}` : "");
  if (document.activeElement !== $("autoRotate")) $("autoRotate").checked = !!S.auto_rotate;
  const host = $("markets");
  if (!S.markets.length) { host.innerHTML = `<div class="panel empty" style="grid-column:1/-1"><b>No markets on the watchlist.</b><br>Click <b>Auto-pick</b> above for the best BTC/ETH strikes, pick from the scanner below, or paste a ticker.</div>`; return; }
  const keep = new Set(S.markets.map(m => m.ticker));
  [...host.children].forEach(c => { if (!keep.has(c.dataset.t)) c.remove(); });
  S.markets.forEach((m, i) => {
    let card = host.querySelector(`[data-t="${CSS.escape(m.ticker)}"]`);
    if (!card) { card = document.createElement("div"); card.className = "panel mcard"; card.dataset.t = m.ticker; host.appendChild(card); }
    if (host.children[i] !== card) host.insertBefore(card, host.children[i]);
    const oldChart = card.querySelector(".chart"), hovered = oldChart && oldChart.matches(":hover");
    const b = m.book || {}, quoting = m.quotes.length > 0;
    const pl = m.plan || {};
    const quotes = m.quotes.length ? m.quotes.map(q => `<span class="qchip"><span class="sq" style="background:${q.action === "buy" ? "var(--bid)" : "var(--ask)"}"></span>${q.action.toUpperCase()} ${q.count} @ ${q.price}¢ · ${q.age}s</span>`).join("") : `<span>No resting quotes${pl.reason ? ` — ${esc(pl.reason)}` : ""}</span>`;
    const modeChip = m.reduce_only ? `<span class="mode ro" title="${esc(m.reduce_only)}">⚠ Reduce-only</span>`
      : `<span class="mode ${esc(pl.mode || "")}" title="${esc(pl.reason || "")}">${esc((pl.mode || "idle").replace("-", " "))}</span>`;
    const fvLine = pl.fv != null ? `<div class="fvline"><span><i class="sq" style="background:var(--fv)"></i> Model <b>${pl.fv}¢</b>${pl.fv_tradeable ? "" : " (display only)"}</span><span title="${esc(pl.fv_detail)}">${esc(pl.fv_detail)}</span>${pl.skew ? `<span>Inventory skew <b>${pl.skew > 0 ? "+" : ""}${pl.skew}¢</b></span>` : ""}${pl.lean ? `<span title="Book gains $${pl.book_delta_usd} per +1% move in the coin; resting quotes lean against it">Delta lean <b>${pl.lean > 0 ? "+" : ""}${pl.lean}¢</b></span>` : ""}</div>`
      : (pl.skew ? `<div class="fvline"><span>Inventory skew <b>${pl.skew > 0 ? "+" : ""}${pl.skew}¢</b></span></div>` : "");
    card.innerHTML = `
      <div class="mhead"><div class="grow"><div class="tk">${esc(m.ticker)}</div><div class="tt">${esc(m.title)}${m.subtitle ? ` · ${esc(m.subtitle)}` : ""}</div></div>
        ${modeChip}
        <span class="chip" title="Time until market closes">${m.close_time ? "⏱ " + untilClose(m.close_time) : ""}</span>
        <button class="x" title="Stop watching" data-rm="${esc(m.ticker)}">${ICON.x}</button></div>
      <div class="quote3">
        <div><div class="lab"><span class="sq" style="background:var(--bid)"></span>Yes bid</div><div class="big num">${cents(b.yes_bid)}</div></div>
        <div class="spread ${quoting ? "ok" : ""}"><div class="lab" style="justify-content:center">Spread</div><div class="big num">${cents(b.spread)}</div></div>
        <div class="r"><div class="lab">Yes ask<span class="sq" style="background:var(--ask)"></span></div><div class="big num">${cents(b.yes_ask)}</div></div>
      </div>
      ${fvLine}
      <div class="mbody"><div><div class="legend" style="margin-bottom:6px"><span><i style="background:var(--bid)"></i>Bid</span><span><i style="background:var(--ask)"></i>Ask</span>${pl.fv != null ? `<span><i class="dash"></i>Model</span>` : ""}</div><div class="chart" id="pc-${i}"></div></div>${ladder(m.book)}</div>
      <div class="mfoot">${quotes}<span class="grow"></span><span>Position <b class="num" style="color:var(--ink)">${m.position > 0 ? "+" : ""}${m.position}</b></span><span>P&amp;L <b class="num ${m.market_pnl_usd > 0 ? "up" : m.market_pnl_usd < 0 ? "down" : ""}">${usd(m.market_pnl_usd, true)}</b></span></div>`;
    const h = m.history;
    if (hovered) { card.querySelector(".chart").replaceWith(oldChart); return; }
    lineChart(card.querySelector(".chart"), {
      series: [{name: "Ask", color: "var(--ask)", values: h.map(p => ({x: p.ts, y: p.ask}))}, {name: "Bid", color: "var(--bid)", values: h.map(p => ({x: p.ts, y: p.bid}))},
               ...(pl.fv != null ? [{name: "Model", color: "var(--fv)", dash: "5 4", values: h.map(p => ({x: p.ts, y: p.fv}))}] : [])],
      band: [{values: h.map(p => ({x: p.ts, y: p.bid}))}, {values: h.map(p => ({x: p.ts, y: p.ask}))}],
      height: 150, yFmt: (v) => v.toFixed(0) + "¢", labels: true,
      xFmt: (ts) => new Date(ts * 1000).toLocaleTimeString([], {hour: "numeric", minute: "2-digit", second: "2-digit", hour12: false}),
    });
  });
}

function renderLedger() {
  const p = S.pnl;
  if (tab === "fills") {
    $("ledger").innerHTML = p.recent_fills.length ? `<table><thead><tr><th>Time</th><th>Ticker</th><th>Side</th><th class="n">Qty</th><th class="n">Price</th><th>Type</th></tr></thead><tbody>${
      p.recent_fills.map(f => `<tr><td class="num">${dt(f.ts)}</td><td><span class="tkc">${esc(f.ticker)}</span></td><td><span class="sq" style="background:${f.action === "buy" ? "var(--bid)" : "var(--ask)"}"></span> ${esc(f.action)} ${esc(f.side)}</td><td class="n">${f.count}</td><td class="n">${f.price_cents}¢</td><td>${esc(f.mode)} · ${esc(f.liquidity || "maker")}${f.strategy ? " · " + esc(f.strategy) : ""}</td></tr>`).join("")
    }</tbody></table>` : `<div class="empty">No fills recorded yet.</div>`;
  } else {
    const openCell = (m) => m.open_usd == null ? `<td class="n">${m.net ? "not priced" : ""}</td>`
      : `<td class="n ${m.open_usd > 0 ? "up" : m.open_usd < 0 ? "down" : ""}" title="marked at ${m.mark}¢">${usd(m.open_usd, true)}</td>`;
    $("ledger").innerHTML = p.markets.length ? `<table><thead><tr><th>Ticker</th><th class="n">Fills</th><th class="n">Net</th><th class="n">Avg cost</th><th class="n">Realized</th><th class="n">Open</th><th class="n">Fees</th><th>Note</th></tr></thead><tbody>${
      p.markets.map(m => `<tr><td><span class="tkc">${esc(m.ticker)}</span></td><td class="n">${m.fills}</td><td class="n">${m.net}</td><td class="n">${m.avg_cost}¢</td><td class="n ${m.realized_usd > 0 ? "up" : m.realized_usd < 0 ? "down" : ""}">${usd(m.realized_usd, true)}</td>${openCell(m)}<td class="n">${usd(m.fees_usd)}</td><td>${esc(m.note)}</td></tr>`).join("")
    }</tbody></table>` : `<div class="empty">No markets traded yet.</div>`;
  }
}

function renderConsole() {
  const c = $("console"), stick = c.scrollTop + c.clientHeight >= c.scrollHeight - 20;
  c.innerHTML = S.logs.length ? S.logs.map(l => `<div class="l ${l.level} ${/FILL/.test(l.msg) ? "fill" : ""}"><span class="ts">${t2(l.ts)}</span>${esc(l.msg)}</div>`).join("") : `<div class="l" style="color:var(--ink-3)">Waiting for activity…</div>`;
  $("logCount").textContent = `${S.logs.length} lines`;
  if (stick) c.scrollTop = c.scrollHeight;
}

let scanTab = "fair-value", arbData = null;
const SCAN_NOTES = {
  "fair-value": "Crypto markets priced by the calibrated model. Edge = reacting to spot moves faster than resting quotes, plus taking when the book lags by the take threshold. Ranked by est. $/day (a heuristic, not a forecast).",
  "book": "No model — the bot quotes inside a spread wide enough to pay both fees. Edge is theoretical: one-way order flow can erase it (the Fed simulation did). Shortlist, then run simulate.py.",
  "rejected": "The most active markets that failed a filter, and why.",
};
const closes = (h) => h == null ? "—" : h > 48 ? Math.round(h / 24) + "d" : Math.round(h) + "h";

function renderScanner() {
  if (!scanData) return;
  const watched = new Set(S ? S.markets.map(m => m.ticker) : []);
  const c = scanData.counts || {};
  $("scanMeta").textContent = scanData.running && !scanData.ts ? "sweeping…" :
    `${(scanData.markets_active || 0).toLocaleString()} active · ${c["fair-value"] || 0} fair-value · ${c.book || 0} spread · ${scanData.ts ? t2(scanData.ts) : ""}${scanData.running ? " · refreshing…" : ""}`;
  $("scanNote").textContent = SCAN_NOTES[scanTab];
  const rows = scanData.rows.filter(r => scanTab === "rejected" ? !r.tradeable : r.tradeable && r.strategy === scanTab);
  if (!rows.length) { $("scanner").innerHTML = `<div class="empty">${scanData.ts ? "<b>Nothing in this list right now.</b>" : "Sweeping every open market (~15s)…"}</div>`; return; }
  const fvCols = scanTab === "fair-value";
  $("scanner").innerHTML = `<table><thead><tr><th>Market</th><th class="n">24h vol</th><th class="n">Bid</th><th class="n">Ask</th>${fvCols ? `<th class="n">Model</th><th class="n" title="Best take edge after taker fee">Take</th>` : `<th class="n">Spread</th><th class="n" title="Captured per contract after fees">Edge/c</th>`}${scanTab === "rejected" ? "<th>Why not</th>" : `<th class="n">$/day*</th>`}<th class="n">Closes</th><th></th></tr></thead><tbody>${
    rows.map(r => `<tr><td><span class="tkc">${esc(r.ticker)}</span><div class="sub">${esc(r.title)}${r.subtitle ? " · " + esc(r.subtitle) : ""}</div></td>
      <td class="n">${Math.round(r.volume_24h).toLocaleString()}</td><td class="n">${cents(r.yes_bid)}</td><td class="n">${cents(r.yes_ask)}</td>
      ${fvCols ? `<td class="n">${r.fv != null ? r.fv + "¢" : "—"}</td><td class="n ${r.fv_edge >= (S ? S.params.take_edge_cents : 4) ? "up" : ""}">${r.fv_edge != null ? r.fv_edge + "¢" : "—"}</td>`
               : `<td class="n">${cents(r.spread)}</td><td class="n">${r.edge_per_contract != null ? r.edge_per_contract + "¢" : "—"}</td>`}
      ${scanTab === "rejected" ? `<td><span class="sub">${esc(r.reasons.join(", "))}</span></td>` : `<td class="n">$${r.est_edge_day_usd.toFixed(2)}</td>`}
      <td class="n">${closes(r.hours_to_close)}</td>
      <td class="n">${watched.has(r.ticker) ? `<span class="sub">Watching</span>` : r.tradeable ? `<button class="btn sm" data-watch="${esc(r.ticker)}">Watch</button>` : ""}</td></tr>`).join("")
  }</tbody></table>`;
}

function renderArb() {
  if (!arbData) return;
  $("arbMeta").textContent = arbData.ts ? `${(arbData.events_scanned || 0).toLocaleString()} events · ${t2(arbData.ts)}` : (arbData.running ? "sweeping…" : "");
  const list = arbData.confirmed || [];
  $("arb").innerHTML = list.length ? list.map(a => `<div class="arbcard">
      <div><span class="pill good">${ICON.check}${esc(a.type)}</span> <b>${usd(a.profit_usd)}</b> on ${a.size} set${a.size === 1 ? "" : "s"} · ${a.edge_per_set_cents}¢/set after fees</div>
      <div class="sub" style="margin-top:4px">${esc(a.title)}</div>
      <div class="legs">${a.legs.map(l => `<span>${esc(l.action)} ${esc(l.ticker)} @ ${l.price}¢</span>`).join("")}</div></div>`).join("")
    : `<div class="empty"><b>No arbitrage right now.</b><br>Checks every mutually-exclusive event and strike ladder on Kalshi each sweep, confirmed against live books. Gaps are rare and brief — confirmed ones are logged to <span class="num">arb_log.jsonl</span>. Not auto-executed.</div>`;
}

async function loadScan(force=false) {
  try {
    [scanData, arbData] = await Promise.all([api("GET", "/api/scan" + (force ? "?force=1" : "")), api("GET", "/api/arb")]);
    renderScanner(); renderArb();
    if (force) toast("Rescanning all of Kalshi (~15s)…");
  } catch (e) { $("scanner").innerHTML = `<div class="empty">Scan failed: ${esc(e.message)}</div>`; }
  clearTimeout(loadScan._t);
  loadScan._t = setTimeout(loadScan, scanData && scanData.running ? 4000 : 30000);
}

let polling = false;
async function poll() {
  if (polling) return; polling = true;
  try {
    S = await api("GET", "/api/state");
    renderHeader(); renderKpis(); renderEquity(); renderRisk(); renderMarkets(); renderLedger(); renderConsole();
    if (scanData) renderScanner();
  } catch (e) {
    $("chips").innerHTML = `<span class="chip crit"><span class="dot"></span>Disconnected</span>`;
  } finally { polling = false; }
}

/* ---------- events ---------- */
$("btnKill").onclick = () => { if (confirm("Halt the bot and cancel every resting quote?")) act("POST", "/api/kill", null, "Kill switch engaged"); };
$("addForm").onsubmit = (e) => { e.preventDefault(); const t = $("addInput").value.trim(); if (t) act("POST", "/api/tickers", {ticker: t}, `Watching ${t.toUpperCase()}`).then(() => $("addInput").value = ""); };
$("btnScan").onclick = () => loadScan(true);
$("btnAutopick").onclick = async () => {
  const b = $("btnAutopick"); b.disabled = true; const label = b.innerHTML; b.innerHTML = "Picking…";
  try { const r = await api("POST", "/api/autopick"); toast("Auto-pick: " + r.msg); await poll(); }
  catch (e) { toast(e.message, true); }
  finally { b.disabled = false; b.innerHTML = label; }
};
$("autoRotate").onchange = (e) => act("POST", "/api/autorotate", {on: e.target.checked}, e.target.checked ? "Auto-rotate on" : "Auto-rotate off");
document.addEventListener("click", (e) => {
  const st = e.target.closest(".stab"); if (st) { scanTab = st.dataset.stab; document.querySelectorAll(".stab").forEach(x => x.classList.toggle("on", x === st)); renderScanner(); return; }
  const w = e.target.closest("[data-watch]"); if (w) { w.disabled = true; act("POST", "/api/tickers", {ticker: w.dataset.watch}, `Watching ${w.dataset.watch}`).then(renderScanner); }
  const rm = e.target.closest("[data-rm]"); if (rm) act("DELETE", "/api/tickers/" + encodeURIComponent(rm.dataset.rm), null, `Removed ${rm.dataset.rm}`);
  const tb = e.target.closest(".tab:not(.stab)"); if (tb) { tab = tb.dataset.tab; document.querySelectorAll(".tab:not(.stab)").forEach(x => x.classList.toggle("on", x === tb)); if (S) renderLedger(); }
});
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => S && (renderEquity(true), renderMarkets()), 150); });

poll(); setInterval(poll, 1500); loadScan();
</script>
</body>
</html>
